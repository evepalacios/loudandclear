<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Loud &amp; Clear — Resultados en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --void: #0B0E14;
    --panel: #131A24;
    --panel2: #1B2430;
    --line: #26303D;
    --amber: #FFA83E;
    --cyan: #2FD9E8;
    --red: #FF4C4C;
    --hi: #EDF1F5;
    --mid: #8A97A6;
    --dim: #4C5866;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--hi);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .display { font-family: 'Rajdhani', sans-serif; }
  .mono { font-family: 'Share Tech Mono', monospace; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11,14,20,0.95); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--panel2);
    padding: 18px 16px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--amber), var(--red));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.03em; }
  header p { margin: 2px 0 0; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.15em; }

  .tabs {
    display: flex; gap: 8px; padding: 14px 16px 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 9px 15px; border-radius: 999px;
    font-family: 'Rajdhani'; font-weight: 600; font-size: 14px;
    border: 1px solid var(--line); background: transparent; color: var(--mid);
    white-space: nowrap; cursor: pointer;
  }
  .tab.active { background: var(--amber); color: var(--void); border-color: var(--amber); }
  .tab.add { border-style: dashed; display: flex; align-items: center; gap: 4px; }

  .add-cat-row { display: none; gap: 8px; padding: 0 16px 12px; }
  .add-cat-row.show { display: flex; }
  .add-cat-row input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; color: var(--hi); font-size: 14px;
  }
  .btn-mini { padding: 0 14px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }

  .leader-banner {
    margin: 0 16px 16px; padding: 14px; border-radius: 12px;
    border: 1px solid rgba(255,168,62,0.4);
    background: linear-gradient(90deg, rgba(255,168,62,0.1), transparent);
    display: none; align-items: center; gap: 12px;
  }
  .leader-banner.show { display: flex; }
  .leader-banner .trophy { font-size: 22px; }
  .leader-banner .info { flex: 1; min-width: 0; }
  .leader-banner .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,168,62,0.85); }
  .leader-banner .name { font-family: 'Rajdhani'; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leader-banner .name span { color: var(--mid); font-weight: 400; }
  .leader-banner .score { font-family: 'Share Tech Mono'; font-size: 24px; color: var(--amber); }

  #list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .empty { text-align: center; padding: 40px 0; color: var(--dim); font-size: 14px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    border-radius: 10px; padding: 12px; border: 1px solid var(--line); background: var(--panel);
  }
  .row.winner { border-color: rgba(255,168,62,0.6); background: rgba(255,168,62,0.06); }
  .rank {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Rajdhani'; font-weight: 600; font-size: 12px;
    background: var(--panel2); color: var(--mid); border: 1px solid var(--line);
  }
  .row.winner .rank { background: var(--amber); color: var(--void); border: none; }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); flex-shrink: 0; background: var(--panel2); }
  .row .info { flex: 1; min-width: 0; }
  .row .cname { font-family: 'Rajdhani'; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .ccar { font-size: 11px; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { display: flex; gap: 3px; align-items: flex-end; height: 16px; margin-top: 6px; }
  .meter div { width: 6px; border-radius: 1px; background: var(--line); }
  .row .score { text-align: right; flex-shrink: 0; }
  .row .score .val { font-family: 'Share Tech Mono'; font-size: 20px; color: var(--cyan); line-height: 1; }
  .row.winner .score .val { color: var(--amber); }
  .row .score .unit { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .del-btn { background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px; flex-shrink: 0; font-size: 14px; }
  .del-btn:hover { color: var(--red); }

  .add-section { padding: 16px; }
  .btn-add {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: var(--cyan); color: var(--void); font-family: 'Rajdhani'; font-weight: 700;
    font-size: 15px; cursor: pointer; letter-spacing: 0.02em;
  }
  .btn-add:disabled { opacity: 0.5; }

  .form-card {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mid); display: block; margin-bottom: 5px; }
  .field input {
    width: 100%; background: var(--void); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; color: var(--hi); font-size: 14px; font-family: 'Inter';
  }
  .field input:focus { outline: none; border-color: var(--cyan); }
  .field.db input { font-family: 'Share Tech Mono'; font-size: 24px; color: var(--cyan); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .photo-picker {
    width: 100%; height: 110px; border-radius: 8px; border: 1px dashed #3A4654;
    background: none; color: var(--mid); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 13px;
    overflow: hidden; position: relative; padding: 0;
  }
  .photo-picker img { width: 100%; height: 100%; object-fit: cover; }
  .photo-picker .tag2 { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.6); font-size: 10px; padding: 2px 8px; border-radius: 6px; color: var(--hi); }

  .form-actions { display: flex; gap: 8px; }
  .form-actions button { flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn-cancel { background: none; border: 1px solid var(--line); color: var(--mid); }
  .btn-save { border: none; font-weight: 600; background: var(--amber); color: var(--void); }
  .btn-save:disabled { background: #3A4654; color: var(--dim); }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); color: var(--hi);
    padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 50;
    opacity: 0; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">🔊</div>
  <div>
    <h1>LOUD &amp; CLEAR</h1>
    <p id="subtitle">Resultados en vivo</p>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div class="add-cat-row" id="addCatRow">
  <input id="newCatInput" placeholder="Nombre de la categoría" />
  <button class="btn-mini" style="background:var(--cyan); color:var(--void);" onclick="createCategory()">Crear</button>
  <button class="btn-mini" style="background:none; border:1px solid var(--line); color:var(--mid);" onclick="toggleAddCat(false)">✕</button>
</div>

<div class="leader-banner" id="leaderBanner">
  <div class="trophy">🏆</div>
  <div class="info">
    <div class="tag" id="leaderTag">Va ganando</div>
    <div class="name" id="leaderName"></div>
  </div>
  <div class="score" id="leaderScore"></div>
</div>

<div id="list"></div>

<div class="add-section">
  <button class="btn-add" id="toggleFormBtn" onclick="toggleForm(true)">+ AGREGAR COMPETIDOR</button>
  <div class="form-card" id="formCard" style="display:none;">
    <div class="grid2">
      <div class="field">
        <label>Competidor</label>
        <input id="fName" placeholder="Nombre" />
      </div>
      <div class="field">
        <label>Carro</label>
        <input id="fCar" placeholder="Ej. Silverado 2019" />
      </div>
    </div>
    <div class="field db">
      <label>Nivel alcanzado (dB)</label>
      <input id="fDb" placeholder="0.0" inputmode="decimal" />
    </div>
    <div class="field">
      <label>Foto</label>
      <input type="file" accept="image/*" capture="environment" id="fPhotoInput" style="display:none" onchange="onPhotoChosen(event)" />
      <button type="button" class="photo-picker" id="photoPicker" onclick="document.getElementById('fPhotoInput').click()">
        <span id="photoPickerLabel">📷 Foto de la medición</span>
      </button>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="toggleForm(false)">Cancelar</button>
      <button class="btn-save" id="saveBtn" onclick="submitCompetitor()">Guardar resultado</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let categories = [];
let activeId = null;
let selectedPhoto = null;

async function api(path, options = {}) {
  const res = await fetch('/api' + path, options);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Error');
  return res.json();
}

async function loadCategories() {
  categories = await api('/categories');
  if (!activeId && categories.length) activeId = categories[0].id;
  renderTabs();
  if (activeId) loadCompetitors();
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  categories.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (c.id === activeId ? ' active' : '');
    btn.textContent = c.name;
    btn.onclick = () => { activeId = c.id; renderTabs(); loadCompetitors(); };
    tabs.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'tab add';
  addBtn.textContent = '+ Categoría';
  addBtn.onclick = () => toggleAddCat(true);
  tabs.appendChild(addBtn);
}

function toggleAddCat(show) {
  document.getElementById('addCatRow').classList.toggle('show', show);
  if (show) document.getElementById('newCatInput').focus();
}

async function createCategory() {
  const input = document.getElementById('newCatInput');
  const name = input.value.trim();
  if (!name) return;
  const cat = await api('/categories', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  input.value = '';
  toggleAddCat(false);
  activeId = cat.id;
  await loadCategories();
}

async function loadCompetitors() {
  const cat = categories.find(c => c.id === activeId);
  document.getElementById('subtitle').textContent = cat ? cat.name : 'Resultados en vivo';
  const competitors = await api(`/categories/${activeId}/competitors`);
  renderList(competitors);
}

function renderList(competitors) {
  const list = document.getElementById('list');
  const banner = document.getElementById('leaderBanner');
  list.innerHTML = '';

  if (!competitors.length) {
    list.innerHTML = '<div class="empty">Aún no hay competidores en esta categoría.</div>';
    banner.classList.remove('show');
    return;
  }

  const maxDb = competitors[0].db_level || 1;
  const leader = competitors[0];
  const cat = categories.find(c => c.id === activeId);

  document.getElementById('leaderTag').textContent = 'Va ganando · ' + (cat ? cat.name : '');
  document.getElementById('leaderName').innerHTML = leader.name + ' <span>— ' + leader.car + '</span>';
  document.getElementById('leaderScore').textContent = leader.db_level.toFixed(1);
  banner.classList.add('show');

  competitors.forEach((comp, i) => {
    const isWinner = i === 0;
    const row = document.createElement('div');
    row.className = 'row' + (isWinner ? ' winner' : '');

    const segments = 20;
    const pct = maxDb > 0 ? comp.db_level / maxDb : 0;
    const filled = Math.round(pct * segments);
    let meterHtml = '';
    for (let s = 0; s < segments; s++) {
      const isFilled = s < filled;
      const zone = s / segments;
      let color = '#26303D';
      if (isFilled) {
        if (zone > 0.85) color = '#FF4C4C';
        else if (zone > 0.6) color = '#FFA83E';
        else color = '#2FD9E8';
      }
      const h = 40 + s * 3;
      meterHtml += `<div style="height:${h}%; background:${color}; ${isFilled ? `box-shadow:0 0 6px ${color}88;` : ''}"></div>`;
    }

    row.innerHTML = `
      <div class="rank">${isWinner ? '🏆' : (i + 1)}</div>
      ${comp.photo_path
        ? `<img class="thumb" src="${comp.photo_path}" />`
        : `<div class="thumb"></div>`}
      <div class="info">
        <div class="cname">${escapeHtml(comp.name)}</div>
        <div class="ccar">${escapeHtml(comp.car)}</div>
        <div class="meter">${meterHtml}</div>
      </div>
      <div class="score">
        <div class="val">${comp.db_level.toFixed(1)}</div>
        <div class="unit">dB</div>
      </div>
      <button class="del-btn" onclick="deleteCompetitor(${comp.id})">🗑</button>
    `;
    list.appendChild(row);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function deleteCompetitor(id) {
  await api('/competitors/' + id, { method: 'DELETE' });
  loadCompetitors();
}

function toggleForm(show) {
  document.getElementById('formCard').style.display = show ? 'flex' : 'none';
  document.getElementById('toggleFormBtn').style.display = show ? 'none' : 'block';
  if (!show) resetForm();
}

function resetForm() {
  document.getElementById('fName').value = '';
  document.getElementById('fCar').value = '';
  document.getElementById('fDb').value = '';
  selectedPhoto = null;
  document.getElementById('photoPicker').innerHTML = '<span id="photoPickerLabel">📷 Foto de la medición</span>';
}

function onPhotoChosen(e) {
  const file = e.target.files[0];
  if (!file) return;
  selectedPhoto = file;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('photoPicker').innerHTML =
      `<img src="${reader.result}" /><span class="tag2">Cambiar</span>`;
  };
  reader.readAsDataURL(file);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function submitCompetitor() {
  const name = document.getElementById('fName').value.trim();
  const car = document.getElementById('fCar').value.trim();
  const dbLevel = document.getElementById('fDb').value.trim();
  if (!name || !car || !dbLevel) {
    showToast('Falta nombre, carro o dB');
    return;
  }
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Guardando...';
  try {
    const formData = new FormData();
    formData.append('name', name);
    formData.append('car', car);
    formData.append('db_level', dbLevel);
    if (selectedPhoto) formData.append('photo', selectedPhoto);

    await fetch(`/api/categories/${activeId}/competitors`, {
      method: 'POST',
      body: formData
    });

    toggleForm(false);
    loadCompetitors();
    showToast('Resultado guardado');
  } catch (err) {
    showToast('Error al guardar');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Guardar resultado';
  }
}

document.getElementById('fDb').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[^0-9.]/g, '');
});

loadCategories();
// Poll every 5s so multiple phones stay in sync
setInterval(() => { if (activeId) loadCompetitors(); }, 5000);
</script>

</body>
</html>
